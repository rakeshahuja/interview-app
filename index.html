<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Interview Practice</title>
<style>
  :root{
    color-scheme:light;
    --bg:#f5f7fc;
    --card:#ffffff;
    --text:#18243b;
    --muted:#68758e;
    --primary:#4f46e5;
    --primary-dark:#3730a3;
    --primary-soft:#eef0ff;
    --good:#12805c;
    --bad:#c83e58;
    --warn:#b66b12;
    --border:#e4e9f2;
    --shadow:0 12px 34px rgba(29,43,76,.075);
    --shadow-hover:0 18px 42px rgba(29,43,76,.12);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    min-height:100vh;
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
    color:var(--text);
    line-height:1.65;
    background:
      radial-gradient(ellipse at 10% 0%,rgba(99,102,241,.12),transparent 34rem),
      radial-gradient(ellipse at 100% 12%,rgba(20,184,166,.09),transparent 29rem),
      var(--bg);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:min(100% - 40px,920px);margin:0 auto;padding:48px 0 76px}
  header{
    display:flex;flex-wrap:wrap;gap:20px;align-items:center;
    justify-content:space-between;margin-bottom:8px;
  }
  h1{
    margin:0;font-size:clamp(29px,4.5vw,40px);font-weight:850;
    letter-spacing:-1.6px;line-height:1.15;
    background:linear-gradient(110deg,#312e81 0%,#4f46e5 52%,#0f8b8d 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{color:var(--muted);margin:10px 0 30px;font-size:15px}
  .keybox{
    display:flex;gap:10px;align-items:center;flex:1 1 300px;
    max-width:370px;padding:7px 10px;background:rgba(255,255,255,.82);
    border:1px solid rgba(221,227,239,.95);border-radius:15px;
    box-shadow:0 5px 18px rgba(29,43,76,.045);
    backdrop-filter:blur(12px);
  }
  .keybox:before{content:"🔐";font-size:15px;padding-left:4px}
  .keybox input{
    width:100%;min-width:0;padding:8px 6px;border:0!important;
    background:transparent!important;box-shadow:none!important;
  }
  .card{
    position:relative;overflow:hidden;
    background:rgba(255,255,255,.96);
    border:1px solid rgba(226,231,241,.95);border-radius:22px;
    padding:clamp(22px,4vw,34px);margin-bottom:20px;
    box-shadow:var(--shadow);
    transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
    animation:cardIn .35s ease both;
  }
  .card:hover{transform:translateY(-2px);border-color:#d8def0;box-shadow:var(--shadow-hover)}
  h2{margin:0 0 16px;font-size:23px;font-weight:780;letter-spacing:-.6px;line-height:1.3}
  h3{margin:0 0 10px;font-size:17px;font-weight:760;letter-spacing:-.25px}
  .q{
    font-size:clamp(19px,2.6vw,22px);font-weight:720;line-height:1.5;
    margin:17px 0 20px;color:#202d49;
  }
  textarea,select,input{
    display:block;width:100%;padding:14px 16px;
    border:1px solid #dce3ef;border-radius:13px;
    font:inherit;font-size:15px;background:#fbfcff;color:var(--text);
    outline:none;transition:border-color .18s,box-shadow .18s,background .18s;
  }
  select{cursor:pointer}
  textarea{min-height:160px;resize:vertical;line-height:1.7}
  textarea::placeholder,input::placeholder{color:#98a3b7}
  textarea:focus,select:focus,input:focus{
    border-color:#7772ed;box-shadow:0 0 0 4px rgba(79,70,229,.12);
    background:#fff;
  }
  button{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:linear-gradient(115deg,#4f46e5,#6863ed);
    color:#fff;border:0;border-radius:12px;padding:12px 21px;
    font:inherit;font-size:14px;font-weight:750;letter-spacing:.1px;
    cursor:pointer;margin-top:15px;min-height:46px;
    box-shadow:0 7px 16px rgba(79,70,229,.2);
    transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;
  }
  button:hover:not(:disabled){
    transform:translateY(-2px);filter:brightness(1.04);
    box-shadow:0 10px 22px rgba(79,70,229,.27);
  }
  button:active:not(:disabled){transform:translateY(0)}
  button:focus-visible,summary:focus-visible{
    outline:3px solid rgba(79,70,229,.35);outline-offset:3px;
  }
  button:disabled{opacity:.58;cursor:wait;box-shadow:none;transform:none}
  button.ghost{
    background:#f1f2ff;color:var(--primary-dark);
    border:1px solid #dedfff;box-shadow:none;
  }
  button.ghost:hover:not(:disabled){background:#e9eaff;box-shadow:0 7px 16px rgba(79,70,229,.1)}
  .msg{display:inline-block;margin:10px 0 0 10px;color:var(--muted);font-size:13px}
  .err{color:var(--bad);font-weight:650}
  .progress{
    height:9px;background:#e9edf6;border-radius:99px;overflow:hidden;
    margin-bottom:22px;
  }
  .progress div{
    height:100%;border-radius:99px;
    background:linear-gradient(90deg,#4f46e5,#7772ed,#18a6a0);
    transition:width .4s ease;
  }
  .score{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:112px;padding:8px 16px;margin:2px 0 18px;
    color:#3730a3;background:linear-gradient(135deg,#f0f0ff,#e9fbf8);
    border:1px solid #dfdefe;border-radius:15px;
    font-size:30px;font-weight:850;letter-spacing:-1px;
  }
  .row{
    display:grid;grid-template-columns:132px minmax(70px,1fr) 52px;
    gap:12px;align-items:center;margin:11px 0 3px;font-size:13px;font-weight:680;
  }
  .bar{height:9px;background:#edf0f6;border-radius:99px;overflow:hidden}
  .bar div{
    height:100%;border-radius:99px;
    background:linear-gradient(90deg,#5b55e8,#27a39f);
  }
  .reason{color:var(--muted);font-size:13px;margin:3px 0 14px 144px;line-height:1.55}
  .tag{
    display:inline-block;background:#fff1f3;color:#b8324c;
    border:1px solid #f8d7de;border-radius:99px;
    padding:5px 11px;font-size:12px;font-weight:680;margin:3px 5px 3px 0;
  }
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .box{
    border-radius:14px;padding:16px;white-space:pre-wrap;
    min-height:96px;font-size:14px;line-height:1.75;
  }
  .yours{background:#fffaf0;border:1px solid #f0dfb9;color:#604b25}
  .model{background:#effaf5;border:1px solid #c8e9d8;color:#205b40}
  .good{color:var(--good);font-weight:760}
  .bad{color:var(--bad);font-weight:760}
  details{
    background:#fbfcff;border:1px solid var(--border);
    border-radius:14px;padding:14px 17px;margin:11px 0;
    transition:border-color .18s,background .18s,box-shadow .18s;
  }
  details[open]{background:#fff;border-color:#cdd0fb;box-shadow:0 5px 16px rgba(49,46,129,.045)}
  summary{cursor:pointer;font-weight:710;color:#303c59;line-height:1.55}
  details> :not(summary){margin-top:14px}
  ul{margin:8px 0 8px 21px;padding:0}
  li{padding:3px 0;color:#4c5870}
  #app>.card:first-child{margin-top:8px}
  #nextBtn{min-width:190px}
  @keyframes cardIn{
    from{opacity:0;transform:translateY(9px)}
    to{opacity:1;transform:translateY(0)}
  }
  @media(max-width:640px){
    .wrap{width:min(100% - 28px,920px);padding:28px 0 50px}
    header{align-items:stretch;gap:14px}
    .keybox{max-width:none;flex-basis:100%}
    .sub{margin:8px 0 22px}
    .card{border-radius:17px;padding:20px;margin-bottom:15px}
    .cols{grid-template-columns:1fr;gap:12px}
    .row{grid-template-columns:96px minmax(45px,1fr) 42px;gap:8px;font-size:12px}
    .reason{margin-left:104px;font-size:12px}
    .score{font-size:27px}
    button{width:100%;margin-top:12px}
    button.ghost{margin-left:0!important}
    .msg{display:block;margin:8px 0 0}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AI Interview Practice</h1>
    <div class="keybox"><input id="apikey" type="password" placeholder="Gemini API key (or type offline)"></div>
  </header>
  <p class="sub">Find your mistakes, see the right answer, and improve.</p>
  <div id="app"></div>
</div>

<script>
const CRITERIA = ["correctness", "clarity", "completeness", "structure", "relevance"];
let QUESTIONS = {};
const S = { stage: "setup", topic: null, idx: 0, results: [], drafts: {}, impDrafts: {} };

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const avg = ev => CRITERIA.reduce((a, c) => a + Number(ev.scores[c] || 0), 0) / CRITERIA.length;

// ---------- API ----------
async function evaluate(question, answer) {
  const key = $("apikey").value.trim();
  if (!key) throw new Error("Please enter your API key at the top (or type offline).");
  const r = await fetch("/api/evaluate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ topic: S.topic, question, answer, api_key: key })
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "Server error");
  return d;
}

// ---------- Feedback HTML ----------
function feedbackHTML(ev, userAnswer) {
  const bars = CRITERIA.map(c => `
    <div class="row"><div>${c[0].toUpperCase() + c.slice(1)}</div>
    <div class="bar"><div style="width:${ev.scores[c] * 10}%"></div></div><div>${ev.scores[c]}/10</div></div>
    <p class="reason">${esc(ev.reasons[c])}</p>`).join("");
  const tags = (ev.mistake_types || []).map(t => `<span class="tag">${esc(t)}</span>`).join("");
  const missed = (ev.missing_points || []).map(p => `<li>${esc(p)}</li>`).join("");
  const steps = (ev.improvement_steps || []).map(p => `<li>${esc(p)}</li>`).join("");
  return `
    <div class="score">${avg(ev).toFixed(1)} / 10</div>
    <h3>Score and reason</h3>${bars}
    ${tags ? `<h3>Mistake type</h3><div>${tags}</div>` : ""}
    <div class="cols" style="margin-top:12px">
      <div><h3>Your answer</h3><div class="box yours">${esc(userAnswer)}</div>
        ${missed ? `<h3 style="margin-top:12px">Missed points</h3><ul>${missed}</ul>` : ""}</div>
      <div><h3>Model answer</h3><div class="box model">${esc(ev.model_answer)}</div></div>
    </div>
    <h3 style="margin-top:12px">Improvement steps</h3><ul>${steps}</ul>`;
}

// ---------- Views ----------
function renderSetup() {
  const opts = Object.keys(QUESTIONS).map(t => `<option>${esc(t)}</option>`).join("");
  $("app").innerHTML = `
    <div class="card"><h2>Choose a topic</h2>
      <select id="topic">${opts}</select>
      <button id="startBtn">Start Interview</button><span id="msg" class="msg err"></span></div>`;
  $("startBtn").onclick = () => {
    if (!$("apikey").value.trim()) { $("msg").textContent = "Please enter your API key at the top (or type offline)."; return; }
    S.topic = $("topic").value;
    S.idx = 0; S.drafts = {}; S.impDrafts = {};
    S.results = new Array(QUESTIONS[S.topic].length).fill(null);
    S.stage = "quiz"; render();
  };
}

function renderQuiz() {
  const qs = QUESTIONS[S.topic], i = S.idx, res = S.results[i];
  let h = `
    <div class="card">
      <div class="progress"><div style="width:${(i + 1) / qs.length * 100}%"></div></div>
      <h2>Question ${i + 1} / ${qs.length}</h2>
      <p class="q">${esc(qs[i])}</p>
      <textarea id="ans" placeholder="Type your answer here...">${esc(S.drafts[i] || "")}</textarea>
      <button id="evalBtn">Evaluate Answer</button><span id="msg" class="msg"></span>
    </div>`;
  if (res) {
    h += `<div class="card">${feedbackHTML(res.ev, res.answer)}</div>`;
    let cmp = "";
    if (res.improved) {
      const b = avg(res.ev), a = avg(res.improved.ev), d = a - b;
      cmp = `<p><b>Before vs After:</b> ${b.toFixed(1)} &rarr; <span class="${d >= 0 ? "good" : "bad"}">${a.toFixed(1)} (${d >= 0 ? "+" : ""}${d.toFixed(1)})</span></p>
             <details><summary>Feedback on your improved answer</summary>${feedbackHTML(res.improved.ev, res.improved.answer)}</details>`;
    }
    h += `<div class="card"><h3>Improve my answer</h3>
      <textarea id="imp" placeholder="Rewrite your answer after reading the model answer...">${esc(S.impDrafts[i] || "")}</textarea>
      <button id="reBtn" class="ghost">Re-evaluate</button><span id="msg2" class="msg"></span>${cmp}</div>
      <button id="nextBtn">${i < qs.length - 1 ? "Next Question" : "View Final Report"}</button>`;
  }
  $("app").innerHTML = h;

  $("ans").oninput = e => { S.drafts[i] = e.target.value; };
  $("evalBtn").onclick = async () => {
    const answer = ($("ans").value || "").trim();
    if (!answer) { $("msg").textContent = "Please write an answer first."; $("msg").className = "msg err"; return; }
    $("evalBtn").disabled = true; $("msg").className = "msg"; $("msg").textContent = "AI is checking your answer...";
    try {
      const ev = await evaluate(qs[i], answer);
      S.results[i] = { q: qs[i], answer, ev, improved: null };
      renderQuiz();
    } catch (e) {
      $("evalBtn").disabled = false; $("msg").className = "msg err"; $("msg").textContent = e.message;
    }
  };
  if (res) {
    $("imp").oninput = e => { S.impDrafts[i] = e.target.value; };
    $("reBtn").onclick = async () => {
      const a = ($("imp").value || "").trim();
      if (!a) { $("msg2").textContent = "Please write your improved answer."; $("msg2").className = "msg err"; return; }
      $("reBtn").disabled = true; $("msg2").className = "msg"; $("msg2").textContent = "Re-checking...";
      try {
        const ev = await evaluate(qs[i], a);
        res.improved = { answer: a, ev };
        renderQuiz();
      } catch (e) {
        $("reBtn").disabled = false; $("msg2").className = "msg err"; $("msg2").textContent = e.message;
      }
    };
    $("nextBtn").onclick = () => {
      if (i < qs.length - 1) S.idx++; else S.stage = "report";
      render(); window.scrollTo(0, 0);
    };
  }
}

function makeNotes(results) {
  const lines = ["REVISION NOTES - " + S.topic, ""];
  results.forEach((r, n) => {
    if (avg(r.ev) < 7) {
      lines.push(`Q${n + 1}. ${r.q}`, `Model answer: ${r.ev.model_answer}`,
        "Missing: " + (r.ev.missing_points || []).join("; "), "");
    }
  });
  if (lines.length === 2) lines.push("Great job! No weak answers found.");
  return lines.join("\n");
}

function renderReport() {
  const results = S.results.filter(Boolean);
  if (!results.length) {
    $("app").innerHTML = `<div class="card"><p>No answers were evaluated.</p><button id="again">Practice Again</button></div>`;
    $("again").onclick = () => { S.stage = "setup"; render(); };
    return;
  }
  const overall = results.reduce((a, r) => a + avg(r.ev), 0) / results.length;
  const crit = {};
  CRITERIA.forEach(c => crit[c] = results.reduce((a, r) => a + Number(r.ev.scores[c] || 0), 0) / results.length);
  const strong = CRITERIA.reduce((a, b) => crit[a] >= crit[b] ? a : b);
  const weak = CRITERIA.reduce((a, b) => crit[a] <= crit[b] ? a : b);
  const bars = CRITERIA.map(c => `<div class="row"><div>${c[0].toUpperCase() + c.slice(1)}</div>
    <div class="bar"><div style="width:${crit[c] * 10}%"></div></div><div>${crit[c].toFixed(1)}</div></div>`).join("");
  const review = results.map((r, n) => `<details><summary>Q${n + 1}: ${esc(r.q)} (${avg(r.ev).toFixed(1)}/10)</summary>${feedbackHTML(r.ev, r.answer)}</details>`).join("");
  $("app").innerHTML = `
    <div class="card"><h2>Final report</h2>
      <div class="score">${overall.toFixed(1)} / 10</div>${bars}
      <p><span class="good">Strength:</span> ${strong}<br><span class="bad">Needs the most improvement:</span> ${weak}</p></div>
    <div class="card"><h3>Question-wise review</h3>${review}</div>
    <button id="dl">Download Revision Notes</button>
    <button id="again" class="ghost" style="margin-left:8px">Practice Again</button>`;
  $("dl").onclick = () => {
    const blob = new Blob([makeNotes(results)], { type: "text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "revision_notes.txt"; a.click();
  };
  $("again").onclick = () => { S.stage = "setup"; render(); window.scrollTo(0, 0); };
}

function render() {
  if (S.stage === "setup") renderSetup();
  else if (S.stage === "quiz") renderQuiz();
  else renderReport();
}

// ---------- Start ----------
try { $("apikey").value = localStorage.getItem("gemini_key") || ""; } catch (e) {}
$("apikey").addEventListener("input", e => { try { localStorage.setItem("gemini_key", e.target.value); } catch (x) {} });

fetch("/api/questions").then(r => r.json()).then(q => { QUESTIONS = q; render(); })
  .catch(() => { $("app").innerHTML = '<div class="card"><p class="err">Could not connect to the backend. Run <b>python backend.py</b> first.</p></div>'; });
</script>
</body>
</html>
